<h3 class="text-center">Product List</h3>

<div class="container">
  <div>
    <input type="text" class="mt-3" placeholder="Search by Title"
           [(ngModel)]="searchText">
  </div>

  <div class="mt-3">
    <button class="btn btn-primary" (click)="sortAscending()">Sort Ascending</button>
    <button class="btn btn-success" (click)="sortDescending()">Sort Descending</button>
  </div>

  <br>

  <div class="row">
    @for (productObj of filteredProducts | paginate: { itemsPerPage: 4, currentPage: p }; track $index) {
      <div class="col-sm-5 mb-3">
      <app-product-card [productObj]="productObj"></app-product-card>
    </div>

    }
  </div>
</div>

<div class="d-flex justify-content-center mt-3">
  <pagination-controls (pageChange)="p = $event"></pagination-controls>
</div>
