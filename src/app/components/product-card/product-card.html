<div class="col-sm-3 mb-3">
  <div class="card">
    <img class="card-img-top" src="{{productObj.image}}" height="250" />

    <div class="card-body text-center">
      <h5 class="card-title text-truncate">Category: {{ productObj.category }}</h5>
      <p class="card-text text-truncate">Title: {{ productObj.title }}</p>
      <p class="card-text text-truncate">Description: {{ productObj.description }}</p>
      <p class="card-text">Price: {{ productObj.price }}</p>
      <p class="card-text">Rate: {{ productObj.rating.rate }}</p>
      <p class="card-text">Count: {{ productObj.rating.count }}</p>
    </div>
  </div>
</div>
