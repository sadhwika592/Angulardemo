<h3 class="text-center">Data Binding</h3>

<div class="border border-3 rounded-2 p-2 m-2">
    <div>Username is: {{userName}}</div>
    <div>Username is: <span [innerText] = "userName"></span></div>
    <div>
        <img src="{{img_url}}" alt="" width ="300" height="300">
        <img [src]="img_url" alt="" width ="300" height="300" class="mx-2">
        <!--<img bind-src="img_url" alt="" width ="300" height="300" class="mx-2">-->
    </div>

    <div class="mt-3">
        <input type="text" value="{{userName}}" class="mx-2"/>
        <input type="text" [value]="userName" class="mx-2"/>
        <input type="text" [(ngModel)]="userName" class="mx-2"/>
        <p class="mx-2">Hello, {{userName}}</p>

    </div>

    <div class="mt-2">
        <button class="btn btn-success mx-2" disabled="{{flag}}">Click me</button>
        <button class="btn btn-success mx-2" [disabled]="flag">Click me</button>
        <span class="mx-2">{{flag}}</span>
        <button class="btn btn-primary mx-2" (click)="toggleFlag()">Toggle Flag</button>
        <button class="btn btn-primary" on-click="toggleFlag()">Toggle Flag</button>
    </div>

<!-- assignment -->
    <div class="mt-4">
        <p [hidden]="!isVisible">This is written in paragraph tag</p>
        <button class="btn btn-primary" (click)="visible()">Click to hide/show</button>
    </div>

    <div class="mt-3 text-center bg-dark text-white p-2">
        <textarea [(ngModel)]="text" maxlength="100"></textarea>
        <p>Remaining :{{100-text.length}}</p>
    </div>
    
    <div class="mt-3 p-2 text-center">
        <select [(ngModel)]= "selectstate">
            <option value="Chicago">Chicago</option>
            <option value="New York">New York</option>
            <option value="Florida">Florida</option>
            <option value="Texas">Texas</option>

        </select>
        <p class="mt-2">you selected : <span class="fw-bold text-dark">{{selectstate}}</span> </p>
    </div>

    <div class="mx-4">
        <input type="number" [(ngModel)]="num1" class="mx-2">
        <input type="number" [(ngModel)]="num2" class="mx-2">

        <select [(ngModel)]="operator" class="mx-2">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        
        <button (click)="calculate()" class="mx-2" class="btn btn-success mx-2">Calculate</button>
        <p>Result: {{ result }}</p>
    </div>

<!--    <div>
        <input [type]="showPassword ? 'text' : 'password'"
        [(ngModel)] = "password"
    </div>-->

    <div class="mt-3 text-center bg-dark text-white p-3">
        <h4>Counter : {{counter}}</h4>
        <button (click)="increment()" class="mx-3" class="btn btn-outline-success mx-2">Increment</button>
        <button (click)="decrement()" class="mx-3" class="btn btn-outline-danger mx-2">Decrement</button>
        <button (click)="reset()" class="btn btn-outline-secondary mx-2">Reset</button>
    </div>

    <div class="mt-4">
        <div [class.dark]="darkMode" [class.light]="!darkMode" class="mt-3">
            <p>This is interesting and looks cool</p>
        </div>
        <button (click)="toggleMode()">Switch to dark/light mode</button>    
    </div>

</div>
